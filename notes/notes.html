<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catatan pribadi Kamila" />
    <title>Notes | Kamila</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/minty/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <main class="notes-app container">
      <header class="page-header">
        <p class="eyebrow">KAMILA</p>
        <h1>My Notes</h1>
        <p>Simpan hal penting, perasaan, dan rencana harianmu.</p>
      </header>

      <section class="panel card" aria-labelledby="form-title">
        <h2 id="form-title">Tulis catatan</h2>
        <form id="noteForm" class="card-body pt-0">
          <label for="title">Judul</label>
          <input
            class="form-control"
            type="text"
            id="title"
            placeholder="Contoh: Rencana hari ini"
            maxlength="100"
            required
          />
          <label for="content">Isi catatan</label>
          <textarea
            class="form-control"
            id="content"
            placeholder="Tulis catatanmu di sini..."
            maxlength="2000"
            required
          ></textarea>
          <div class="form-row">
            <div>
              <label for="category">Kategori</label
              ><select class="form-select" id="category">
                <option value="Personal">Personal</option>
                <option value="Health">Health</option>
                <option value="Food">Food</option>
                <option value="Exercise">Exercise</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label for="mood">Mood</label
              ><select class="form-select" id="mood">
                <option value="Happy">Happy</option>
                <option value="Neutral">Neutral</option>
                <option value="Sad">Sad</option>
                <option value="Tired">Tired</option>
                <option value="Angry">Angry</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button class="button primary btn" id="submitButton" type="submit">
              Simpan catatan
            </button>
            <button
              class="button secondary btn"
              id="cancelEditButton"
              type="button"
              hidden
            >
              Batal edit
            </button>
          </div>
        </form>
      </section>

      <section aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">Daftar catatan</h2>
          <input
            class="form-control"
            type="search"
            id="searchInput"
            placeholder="Cari judul atau isi catatan..."
            aria-label="Cari catatan"
          />
        </div>
        <div class="category-filters" aria-label="Filter kategori">
          <button
            class="category-filter btn active"
            type="button"
            data-category="All"
          >
            Semua
          </button>
          <button
            class="category-filter btn"
            type="button"
            data-category="Personal"
          >
            Personal
          </button>
          <button
            class="category-filter btn"
            type="button"
            data-category="Health"
          >
            Health
          </button>
          <button
            class="category-filter btn"
            type="button"
            data-category="Food"
          >
            Food
          </button>
          <button
            class="category-filter btn"
            type="button"
            data-category="Exercise"
          >
            Exercise
          </button>
          <button
            class="category-filter btn"
            type="button"
            data-category="Other"
          >
            Other
          </button>
        </div>
        <p id="noteCount" class="note-count" aria-live="polite"></p>
        <div id="notesContainer" class="notes-grid"></div>
      </section>
    </main>
    <script src="notes.js"></script>
  </body>
</html>
