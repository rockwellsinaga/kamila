<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pantau Makan & Minum </title>
  
  <link rel="stylesheet" href="nutrisi.css">
</head>
<body>

  <h2>Pantau Makan & Minum Harian</h2>

         <!-- 1. CREAT -->
  <div class="form-container">
    <h3 id="formTitle">Tambah Catatan Harian</h3>
    <input type="hidden" id="editIndex" value="-1">

    <div class="input-group">
      <label for="jumlahGelas">Jumlah Air Minum (Gelas):</label>
      <input type="number" id="jumlahGelas" placeholder="Masukkan jumlah gelas" min="0">
    </div>

    <div class="input-group">
      <h4>Komponen Isi Piringku:</h4>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="karbo"> <label for="karbo">Karbohidrat</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="protein"> <label for="protein">Protein</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="buah"> <label for="buah">Buah</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="lemakSehat"> <label for="lemakSehat">Lemak Sehat</label>
        </div>
      </div>
    </div>

    <button id="btnSimpan" onclick="simpanCatatan()">Simpan Catatan</button>
    <button id="btnBatal" onclick="batalEdit()" hidden>Batal Edit</button>
  </div>

  <!-- DELETE -->
  <h3>Riwayat Catatan Harian</h3>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Tanggal</th>
          <th>Air Minum</th>
          <th>Isi Piringku</th>
          <th>Status Nutrisi</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelRiwayat">
        
      </tbody>
    </table>
  </div>

  
  <script src="nutrisi.js"></script>
</body>
</html>
